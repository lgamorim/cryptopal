name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build CryptoPal.slnx --configuration Release
      - run: dotnet test CryptoPal.slnx --configuration Release --no-build --verbosity normal
      - run: dotnet format CryptoPal.slnx --verify-no-changes
